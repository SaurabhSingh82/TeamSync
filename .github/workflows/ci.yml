name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Django system and migration checks
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --check --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      - name: Backend API suite (SQLite)
        working-directory: backend
        run: python manage.py test apps.users apps.workspaces apps.projects apps.tasks apps.notifications apps.dashboard apps.search apps.core --settings=config.test_settings

  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamsync
          POSTGRES_USER: teamsync
          POSTGRES_PASSWORD: ci-only-not-a-production-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamsync -d teamsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://teamsync:ci-only-not-a-production-password@127.0.0.1:5432/teamsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: PostgreSQL concurrency and row-lock tests
        working-directory: backend
        run: python manage.py test apps.workspaces.tests_postgres apps.projects.tests_postgres apps.tasks.tests_postgres apps.notifications.tests_postgres --settings=config.postgres_test_settings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
