<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TeamSync collaborative project management"
    />
    <link rel="icon" type="image/svg+xml" href="./src/assets/teamsync-logo.svg" />
    <title>TeamSync</title>
    <script>
      try {
        if (localStorage.getItem('teamsync.theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch {
        // The application will fall back to light mode if storage is unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
